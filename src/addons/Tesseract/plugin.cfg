[plugin]

name="Tesseract"
description="Tesseract mod loader & development tool."
author="PhosXD"
version="2.0.0"
script="plugin.gd"
auto_exports=Array[Array]([[true, "user:///MODS/01 Rainbow Pong.tmod", "res://Example Mods/Rainbow Pong"], [true, "user://MODS/02 Colored Players.tmod", "res://Example Mods/Colored Players"], [true, "user://MODS/03 Underwater.tmod", "res://Example Mods/Underwater"]])

[game]

api_version=1
load_from_path="user://MODS"
load_into_path="Example Game"
forbidden_paths=["addons/"]
allow_mods_without_details=false
allow_overwriting_files=true
allow_creating_files=true
allow_mod_scripts=true
blocked_script_keywords=["FileAccess", "DirAccess"]
